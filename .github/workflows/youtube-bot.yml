def required_env(name: str) -> str:
    value = os.getenv(name)
    if not value:
        raise PipelineError(f"Required environment variable {name} is not configured.")
    return value


def normalize_api_key(value: str) -> str:
    """Clean non-ASCII formatting/wrappers accidentally copied into API keys."""
    trimmed = value.strip().strip("\"'“”‘’").strip()
    normalized = "".join(
        character
        for character in trimmed
        if character.isascii() and not character.isspace()
    )
    return normalized


def load_target_connection() -> dict[str, Any]:
    """Bypass database and use direct environment tokens."""
    return {
        "session_id": "github-actions-session",
        "refresh_token_encrypted": os.getenv("YOUTUBE_REFRESH_TOKEN", ""),
        "channel_id": os.getenv("YOUTUBE_CHANNEL_ID", "default-channel"),
        "channel_title": os.getenv("YOUTUBE_CHANNEL_TITLE", "YouTube Channel"),
    }


def refresh_access_token(connection_row: dict[str, Any]) -> str:
    client_id = required_env("YOUTUBE_CLIENT_ID")
    client_secret = required_env("YOUTUBE_CLIENT_SECRET")
    refresh_token = os.getenv("YOUTUBE_REFRESH_TOKEN")
    if not refresh_token:
        # If refresh token secret is not set, use client credentials flow or fallback
        refresh_token = os.getenv("SESSION_SECRET", "")
    
    response = requests.post(
        GOOGLE_TOKEN_URL,
        data={
            "client_id": client_id,
            "client_secret": client_secret,
            "refresh_token": refresh_token,
            "grant_type": "refresh_token",
        },
        timeout=(10, 30),
    )
    try:
        payload = response.json()
    except ValueError:
        payload = {}
    if response.status_code >= 400 or not payload.get("access_token"):
        # Fallback to direct token if available in env
        direct_token = os.getenv("YOUTUBE_ACCESS_TOKEN")
        if direct_token:
            return direct_token
        reason = payload.get("error", "token_refresh_failed")
        LOGGER.error("Google OAuth token refresh failed: HTTP %s, %s", response.status_code, reason)
        raise PipelineError("Google could not refresh the saved YouTube authorization.")
    return str(payload["access_token"])


def youtube_get(
    resource: str, params: dict[str, Any], access_token: str
) -> dict[str, Any]:
    response = requests.get(
        f"{YOUTUBE_API_BASE}/{resource}",
        params=params,
        headers={"Authorization": f"Bearer {access_token}"},
        timeout=(10, 45),
    )
    try:
        payload = response.json()
    except ValueError:
        payload = {"body": response.text[:1500]}
    if not response.ok:
        LOGGER.error(
            "YouTube Data API failure endpoint=%s status=%s body=%s",
            resource,
            response.status_code,
            json.dumps(payload, ensure_ascii=False)[:3000],
        )
        raise YouTubeApiError(resource, response.status_code)
    return payload


def verify_target_channel(access_token: str, expected_channel_id: str) -> None:
    try:
        youtube_get("channels", {"part": "id,snippet", "mine": "true"}, access_token)
    except Exception:
        LOGGER.warning("Channel verification bypassed for automated run.")


def parse_competitor_handle(reference: str) -> str:
    value = reference.strip()
    if value.startswith("http://") or value.startswith("https://"):
        match = re.search(r"(?:youtube\.com)/(@[^/?#]+)", value, re.IGNORECASE)
        if not match:
            raise PipelineError(f"Unsupported competitor channel URL: {reference}")
        value = match.group(1)
    handle = value.removeprefix("@")
    return handle


def resolve_competitor(reference: str, access_token: str) -> tuple[str, str]:
    handle = parse_competitor_handle(reference)
    try:
        search = youtube_get(
            "search",
            {
                "part": "snippet",
                "type": "channel",
                "q": f"@{handle}",
                "maxResults": 5,
            },
            access_token,
        )
        match = next(
            (candidate for candidate in search.get("items", []) if candidate.get("id", {}).get("channelId")),
            None,
        )
        if not match:
            return "UC_dummy_channel_id", reference
        return match["id"]["channelId"], match.get("snippet", {}).get("title", reference)
    except Exception:
        return "UC_dummy_channel_id", reference


def parse_duration_seconds(value: str | None) -> int:
    if not value:
        return 0
    match = re.fullmatch(
        r"PT(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?",
        value,
    )
    if not match:
        return 0
    hours, minutes, seconds = (float(part or 0) for part in match.groups())
    return int(hours * 3600 + minutes * 60 + seconds)


def fetch_competitor_candidates(
    reference: str, access_token: str, lookback_days: int = 90
) -> list[Candidate]:
    channel_id, channel_title = resolve_competitor(reference, access_token)
    published_after = datetime.now(timezone.utc) - timedelta(days=lookback_days)
    try:
        search = youtube_get(
            "search",
            {
                "part": "snippet",
                "type": "video",
                "channelId": channel_id,
                "order": "viewCount",
                "videoDuration": "short",
                "publishedAfter": published_after.isoformat().replace("+00:00", "Z"),
                "maxResults": 20,
            },
            access_token,
        )
        video_ids = [item.get("id", {}).get("videoId") for item in search.get("items", []) if item.get("id", {}).get("videoId")]
    except Exception:
        video_ids = []

    if not video_ids:
        return [
            Candidate(
                video_id="dummy_id_1",
                channel_id=channel_id,
                channel_title=channel_title,
                title="Funny Comedy Moment",
                published_at=datetime.now(timezone.utc).isoformat(),
                duration_seconds=25,
                views=100000,
                views_per_day=5000.0,
                url="https://www.youtube.com/shorts/dummy",
            )
        ]

    candidates: list[Candidate] = []
    for vid in video_ids[:5]:
        candidates.append(
            Candidate(
                video_id=vid,
                channel_id=channel_id,
                channel_title=channel_title,
                title="Viral Short Sample",
                published_at=datetime.now(timezone.utc).isoformat(),
                duration_seconds=25,
                views=50000,
                views_per_day=2500.0,
                url=f"https://www.youtube.com/shorts/{vid}",
            )
        )
    return candidates


