                    {
                        "hook": "Funny opening line",
                        "script": "This is a very funny short comedy script about everyday life situations that make everyone laugh out loud.",
                        "title": "Funny Short #1",
                        "description": "Enjoy this hilarious short! #comedy #shorts #funny",
                        "hashtags": ["#comedy", "#shorts", "#funny"],
                        "tags": ["comedy", "shorts", "funny"]
                    },
                    {
                        "hook": "Another funny opening line",
                        "script": "Here is another quick comedy skit about funny things happening at home when nobody is watching.",
                        "title": "Funny Short #2",
                        "description": "Try not to laugh at this! #humor #shorts #fun",
                        "hashtags": ["#humor", "#shorts", "#fun"],
